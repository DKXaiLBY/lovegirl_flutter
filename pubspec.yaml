name: lovegirl_flutter
description: "LoveGirl - 情侣专属APP"
publish_to: 'none'
version: 3.38.0+172

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  amap_flutter_map:
    path: ./packages/amap_flutter_map
  amap_flutter_base:
    path: ./packages/amap_flutter_base
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  fl_chart: ^0.69.2
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  web_socket_channel: ^3.0.1
  crypto: ^3.0.6
  uuid: ^4.5.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  open_filex: ^4.5.0
  geolocator: ^11.0.0
  book_page_flip: ^0.1.0
  image_cropper: 8.0.2
  flutter_image_compress: ^2.1.0

dependency_overrides:
  amap_flutter_base:
    path: ./packages/amap_flutter_base
  # Flutter 3.27.4 无 Color.toARGB32()（3.28+ 才有），钉住旧版 platform_interface
  image_cropper_platform_interface: 7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/icons/
    - assets/images/deco/
    - assets/images/illus/
    - assets/geo/
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-400.ttf
        - asset: assets/fonts/Caveat-700.ttf
          weight: 700
