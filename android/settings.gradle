pluginManagement {
    def flutterSdkPath = {
        // 开发阶段：优先环境变量（规避 Properties 的 ISO-8859-1 中文路径乱码），再退回 local.properties
        def envSdk = System.getenv("FLUTTER_ROOT")
        if (envSdk != null && !envSdk.isEmpty()) return envSdk
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def sdkFromProps = properties.getProperty("flutter.sdk")
        assert sdkFromProps != null, "flutter.sdk not set in local.properties"
        return sdkFromProps
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle") {
        name = "flutter-tools"
    }

    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.1.0" apply false
    id "org.jetbrains.kotlin.android" version "1.8.22" apply false
}

include ":app"
