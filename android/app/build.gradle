plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localBuildProperties = new Properties()
def localBuildFile = rootProject.file('local.properties')
if (localBuildFile.exists()) {
    localBuildFile.withInputStream { localBuildProperties.load(it) }
}
def amapAndroidKey = providers.environmentVariable('AMAP_ANDROID_KEY')
        .orElse(localBuildProperties.getProperty('amap.android.key', ''))
        .get().trim()

android {
    namespace = "com.lovegirl.lovegirl_flutter"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.lovegirl.lovegirl_flutter"
        minSdk = 21
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders.amapAndroidKey = amapAndroidKey
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            // Keep release unminified while the native AMap mode is being
            // stabilized. This avoids runtime crashes from aggressive R8
            // shrinking on the platform-view map stack.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // The navigation SDK contains its matching map, location and search SDKs.
    implementation 'com.amap.api:navi-3dmap-location-search:11.3.100_3dmap11.3.100_loc11.3.000_sea9.8.1'
}
